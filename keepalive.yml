# Keeps the free-tier Render backend awake so visitors never hit the 30-60 s
# cold start. Render sleeps after ~15 min idle; a ping every 10 min prevents it.
# Free-tier hours (750/month) comfortably cover one always-on service.
name: keep-backend-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' -m 90 https://bountyproof-g3ff.onrender.com/api/health) && [ "$code" = "200" ] && { cat /tmp/h.json; echo; exit 0; }
            echo "attempt $i -> $code"; sleep 15
          done
          exit 1
