<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BountyProof — evidence-based acceptance for software bounties. Predefined GitHub acceptance criteria, on-chain GenLayer adjudication, final decisions recorded in an Intelligent Contract."
    />
    <title>BountyProof — Evidence-based acceptance for software bounties</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong scheme.
      (function () {
        var t = null;
        try { t = localStorage.getItem('bountyproof-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
